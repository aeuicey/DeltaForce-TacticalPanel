name: Deploy Pages & Android Release

# main 分支有新提交时：构建 Web 版部署到 GitHub Pages（Demo），并打包 Android APK 发布 Release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write      # 创建 Release 并上传 APK
  pages: write         # 部署 GitHub Pages
  id-token: write      # Pages 部署身份验证

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: 0.0.2-indoor

jobs:
  # ---- Web Demo → GitHub Pages ----
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Pages 部署在 /<仓库名>/ 子路径，Vite base 与运行时绝对路径都需适配
      - name: Build (Pages base)
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Fix runtime absolute paths for subpath
        run: node scripts/fix-pages-paths.cjs /${{ github.event.repository.name }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

  # ---- Android APK → Release ----
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - run: npm ci --no-audit --no-fund

      # 生成 Web 资源并同步进 Android 工程（插件注册已在仓库内，sync 幂等）
      - run: npm run build && npx cap sync android

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk deltaforce-tactical-map-${{ env.VERSION }}-android-debug.apk

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.VERSION }}-b${{ github.run_number }}
          name: Android v${{ env.VERSION }} (build ${{ github.run_number }})
          body: |
            由 GitHub Actions 自动构建（commit ${{ github.sha }}）。
            Debug 包，仅供测试安装。
          files: deltaforce-tactical-map-${{ env.VERSION }}-android-debug.apk

      # 同一版本号只保留最新 build，旧的 release 与标签自动删除
      - name: Cleanup old releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          KEEP_PREFIX: android-v${{ env.VERSION }}-b
        run: node scripts/cleanup-releases.cjs

  # ---- Windows 桌面端（Electron，与 GitHub Pages 同款纯静态构建，不含服务器功能）→ Release ----
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # 与 Pages 同一份 dist（默认 base '/'，Electron 内置静态服务器托管，无需子路径适配）
      - run: npm run build

      - name: Build Windows installer
        run: npx electron-builder --win

      - name: Create Release with installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ env.VERSION }}-b${{ github.run_number }}
          name: Windows 桌面端 v${{ env.VERSION }} (build ${{ github.run_number }})
          body: |
            由 GitHub Actions 自动构建（commit ${{ github.sha }}）。
            NSIS 安装包，x64。纯静态版，与 GitHub Pages 同款（不含分享模式中联）。
          files: release/deltaforce-tactical-map-${{ env.VERSION }}-setup.exe

      # 同一版本号只保留最新 build，旧的 release 与标签自动删除
      - name: Cleanup old releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          KEEP_PREFIX: desktop-v${{ env.VERSION }}-b
        run: node scripts/cleanup-releases.cjs
