services:
  deltaforce-tactical-map:
    build:
      context: ..              # 构建上下文为项目根目录
      dockerfile: Docker/Dockerfile
    image: deltaforce-tactical-map:0.0.2
    container_name: deltaforce-tactical-map
    ports:
      - "8080:8781"            # 宿主机端口:容器端口（容器内为中继服务器 PORT），按需修改
    restart: unless-stopped
